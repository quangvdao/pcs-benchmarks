# Isolated Plonky3 univariate FRI/STIR worker (FRI/STIR pin, not the WHIR pin).
[workspace]

[package]
name = "pcs-bench-plonky3-uni"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Plonky3 univariate FRI and STIR adapters for the hash PCS comparison"

[[bin]]
name = "hash-eval-fri"
path = "src/bin/hash_eval_fri.rs"

[[bin]]
name = "hash-eval-stir"
path = "src/bin/hash_eval_stir.rs"

[dependencies]
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d", features = ["parallel"] }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-stir = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
p3-whir = { git = "https://github.com/Plonky3/Plonky3", rev = "3acc8b70e68d6c2afc03930700c26540bd47458d" }
rand = { version = "0.10.1", features = ["std", "std_rng"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
