# Isolated Binius64 BaseFold worker.
[workspace]

[package]
name = "pcs-bench-binius64"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Binius64 BaseFold adapter for the hash PCS comparison"

[[bin]]
name = "hash-eval"
path = "src/bin/hash_eval.rs"

[dependencies]
binius-compute = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-hash = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-iop = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-iop-prover = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-ip = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-ip-prover = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-math = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459", features = ["test-utils"] }
binius-transcript = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
rand = { version = "0.10.1", features = ["std", "std_rng"] }
rayon = "1.10"
serde_json = "1.0"

# Same link-time optimisation for every Rust adapter, so no scheme is built
# with a weaker profile than another.
[profile.release]
lto = "thin"
codegen-units = 1
