# Isolated WorldFnd WHIR worker (worldfnd/whir Goldilocks3).
[workspace]

[package]
name = "pcs-bench-whir-provekit"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "WorldFnd WHIR adapter for the hash PCS comparison"

[[bin]]
name = "hash-eval"
path = "src/bin/hash_eval.rs"

[dependencies]
blake3 = { version = "=1.5.5", features = ["digest", "traits-preview"] }
digest = "=0.10.7"
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
rand = { version = "0.8", features = ["std", "std_rng"] }
rayon = "1.10"
serde_json = "1.0"
whir = { git = "https://github.com/worldfnd/whir", rev = "c03a4a512bd904562a22e14bc7b3064392448b99", default-features = false, features = ["parallel"] }
