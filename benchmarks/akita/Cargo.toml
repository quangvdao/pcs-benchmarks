[workspace]

[package]
name = "pcs-bench-akita"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Akita adapter for the PCS benchmark suite"

[dependencies]
# Unmodified pinned upstream checkout, including its schedule artifacts.
akita-algebra = { path = "../../third_party/akita/crates/akita-algebra" }
akita-config = { path = "../../third_party/akita/crates/akita-config" }
akita-cpu-backend = { path = "../../third_party/akita/crates/akita-cpu-backend" }
akita-params = { path = "../../third_party/akita/crates/akita-params", features = ["dev-protocol"] }
akita-pcs = { path = "../../third_party/akita/crates/akita-pcs" }
akita-prover = { path = "../../third_party/akita/crates/akita-prover" }
akita-serialization = { path = "../../third_party/akita/crates/akita-serialization" }
akita-transcript = { path = "../../third_party/akita/crates/akita-transcript" }
akita-types = { path = "../../third_party/akita/crates/akita-types" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "c7c2d08d5bb0c7c80501f29f723e595af7fcff3c", default-features = false, features = ["asm", "solinas"] }
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
rand = "0.8"
rayon = "1.10"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "e2e"
harness = false

[[bin]]
name = "lattice-eval"
path = "src/bin/lattice_eval.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
uninlined_format_args = "allow"

# Same link-time optimisation for every Rust adapter, so no scheme is built
# with a weaker profile than another.
[profile.release]
lto = "thin"
codegen-units = 1
